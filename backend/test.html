<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    TrustLens Backend Test
  </title>

  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
    }

    .test-card {
      width: min(500px, 90%);
      padding: 30px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    #result {
      margin-top: 20px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="test-card">

    <h1>
      TrustLens Backend Test
    </h1>

    <p>
      Click the button to test the Flask connection.
    </p>

    <button
      type="button"
      id="testBackendButton"
    >
      Test Backend
    </button>

    <div id="result"></div>

  </div>


  <script>
    const testButton =
      document.getElementById(
        "testBackendButton"
      );

    const result =
      document.getElementById(
        "result"
      );

    testButton.addEventListener(
      "click",
      async () => {
        result.textContent =
          "Connecting to backend...";

        try {
          const response =
            await fetch(
              "http://127.0.0.1:5000/api/test-connection"
            );

          const data =
            await response.json();

          if (!response.ok) {
            throw new Error(
              data.message ||
              "Backend request failed."
            );
          }

          result.textContent =
            data.message;

        } catch (error) {
          result.textContent =
            `Connection failed: ${error.message}`;
        }
      }
    );
  </script>

</body>
</html>
